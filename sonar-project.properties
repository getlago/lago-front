# SonarCloud project configuration
sonar.organization=getlago
sonar.projectKey=getlago_lago-front

# Source code location
sonar.sources=src

# Exclusions from source files
sonar.exclusions=**/types.{ts,tsx},**/fixtures.ts,**/core/constants/**,**/generated/**,**/styles/**,**/pages/__devOnly/**,**/__tests__/**,**/*.test.{ts,tsx},**/*.spec.{ts,tsx},src/test-utils.tsx,**/dataTestConstants.ts,**/node_modules/**,**/dist/**,**/cypress/**,**/packages/design-system/dist/**,**/__mocks__/**

# Test files inclusion - only include actual test files
# Test files are in __tests__ directories with .test. or .spec. in filename
sonar.test.inclusions=**/__tests__/**/*.{test,spec}.{ts,tsx}

# Test coverage report path (generated by Jest)
# For TypeScript projects, SonarCloud uses sonar.javascript.lcov.reportPaths
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Coverage exclusions - files excluded from code coverage calculation
# Excludes constant files (const.ts, *Const.ts) as they typically don't need test coverage
sonar.coverage.exclusions=**/const.ts,**/*Const.ts,**/*Types.ts,**/types.ts,**/__mocks__/**,**/dataTestConstants.ts

# Duplication exclusions - mock files naturally duplicate the modules they mock
sonar.cpd.exclusions=**/__mocks__/**

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Note: Don't exclude coverage/ folder as SonarQube needs to read lcov.info from it

## RULES TO BE EXCLUDED FROM ANALYSIS:

# Ignore "Do not add then to an object" rule for entire project
# This is a false positive - Yup's .when() API and other libraries legitimately use 'then' for conditional logic
# Configured for both JavaScript and TypeScript analyzers
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S6643
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6643
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# Ignore "Prefer globalThis over window" rule
# Using 'window' is intentional in browser-only code for clarity and is a common convention
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S7764
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S7764
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*

# Ignore "Prefer Number.isNaN over isNaN" rule
# Global isNaN is intentional in this codebase
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S6679
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.{js,jsx,ts,tsx}
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S6679
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*.{js,jsx,ts,tsx}

# Ignore "React components should not be nested"
# Table column `content` callbacks are invoked as plain functions (`column.content(item)`), never mounted as components
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*

# Ignore "Async functions should use async features"
# Dialog, drawer and form callbacks are typed `() => Promise<void>`; the `async` keeps that contract
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*

# Ignore "Prefer Number.parseInt over parseInt"
# Same function, style preference only
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S7773
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*

# Ignore "Built-in constructors should be called consistently with or without new"
# `Array(n)` and `new Array(n)` behave the same
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S7723
sonar.issue.ignore.multicriteria.e10.resourceKey=**/*

# Ignore "Redundant JSX fragments should be removed"
# Harmless, often kept around conditional children
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S6749
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*

# Ignore "Type constituents of unions should not be redundant"
# Literal unions widened with `string` on purpose to accept free-form values
sonar.issue.ignore.multicriteria.e12.ruleKey=typescript:S6571
sonar.issue.ignore.multicriteria.e12.resourceKey=**/*

# Ignore "Optional property declarations should not use both '?' and 'undefined'"
# Explicit `| undefined` matches the generated GraphQL types
sonar.issue.ignore.multicriteria.e13.ruleKey=typescript:S4782
sonar.issue.ignore.multicriteria.e13.resourceKey=**/*

# Ignore "Arrays used only for existence checks should be Sets"
# Micro-optimisation on constant arrays of a few items
sonar.issue.ignore.multicriteria.e14.ruleKey=typescript:S7776
sonar.issue.ignore.multicriteria.e14.resourceKey=**/*

# Ignore "Track uses of TODO tags"
# Pending work is tracked in Linear
sonar.issue.ignore.multicriteria.e15.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e15.resourceKey=**/*
