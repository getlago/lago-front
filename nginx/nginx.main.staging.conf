# Top-level config for the hardened staging image, replacing the Wolfi base's
# stock nginx.conf. The stock one serves its own `listen 80` root and never
# includes conf.d, so without this the app's server block is dead config.
# Everything nginx writes is redirected to the /tmp emptyDir the pod mounts.

worker_processes auto;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  sendfile          on;
  keepalive_timeout 65;

  # nginx creates these at startup and exits if it cannot; the compiled
  # defaults under /var/lib/nginx/tmp are read-only in the pod. Kept flat —
  # nginx creates only the leaf, not intermediate parents.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  include /etc/nginx/conf.d/*.conf;
}
