# Staging variant of nginx.conf: nginx runs as UID 65532 on a read-only rootfs,
# so the listeners move to 8080 and env-config.js is served from /tmp. The
# http-level half lives in nginx.main.staging.conf. Keep the rest in sync with
# nginx.conf until the two are unified behind a shared include.

server {
  listen 8080;
  listen [::]:8080;

  root /usr/share/nginx/html;

  # Do not disclose the nginx version in the Server header or on error pages.
  server_tokens off;

  # .env.sh sits in the doc root. Never serve dotfiles.
  location ~ /\. {
    return 404;
  }

  # .env.sh writes env-config.js to /tmp (the dist is read-only). index.html
  # references it relatively, so match it under any path, not just the root.
  location ~ ^/(.*/)?env-config\.js$ {
    include /tmp/csp.conf;
    add_header Cache-Control "no-cache";
    alias /tmp/env-config.js;
  }

  # Hashed assets — cache forever (filename hash changes on each build)
  location /assets/ {
    include /tmp/csp.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /tmp/csp.conf;
    add_header Cache-Control "no-cache";
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
