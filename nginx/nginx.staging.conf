# Staging variant of nginx.conf: identical except the listen ports.
# nginx runs as UID 65532 here and cannot bind privileged ports, so both the
# IPv4 and IPv6 listeners move to 8080. Keep the rest in sync with nginx.conf
# until the two are unified behind a shared listen include.

server {
  listen 8080;
  listen [::]:8080;

  root /usr/share/nginx/html;

  # nginx is compiled with its temp paths under /var/lib/nginx and creates them
  # at startup, which fails on a read-only root. Point them all at /tmp so the
  # pod needs exactly one writable mount.
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  # .env.sh regenerates this at every start. Under readOnlyRootFilesystem it
  # cannot be written into the served dist, so it is written to /tmp (an
  # emptyDir) and aliased back onto its original URL here.
  location = /env-config.js {
    alias /tmp/env-config.js;
    add_header Cache-Control "no-store";
  }

  # Hashed assets — cache forever (filename hash changes on each build)
  location /assets/ {
    include /etc/nginx/conf.d/csp.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/csp.conf;
    add_header Cache-Control "no-cache";
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
