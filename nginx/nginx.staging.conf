# Staging variant of nginx.conf: identical except the listen ports.
# nginx runs as UID 65532 here and cannot bind privileged ports, so both the
# IPv4 and IPv6 listeners move to 8080. Keep the rest in sync with nginx.conf
# until the two are unified behind a shared listen include.

server {
  listen 8080;
  listen [::]:8080;

  root /usr/share/nginx/html;

  # Hashed assets — cache forever (filename hash changes on each build)
  location /assets/ {
    include /etc/nginx/conf.d/csp.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/csp.conf;
    add_header Cache-Control "no-cache";
    index index.html index.htm;
    try_files $uri $uri/ /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
