name: Tests
permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, review_requested, ready_for_review, synchronize]
  push:
    branches:
      - main

jobs:
  typecheck:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Build packages
        run: pnpm prebuild

      - name: Run Typescript
        run: pnpm tsc

  test-shard:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    name: Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: package.json
          cache: "pnpm"

      - name: Install Node.js dependencies
        run: pnpm install

      - name: Run tests
        run: |
          pnpm jest --config jest.config.ts --coverage --shard=${{ matrix.shard }}/4

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 1

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: junit-shard-${{ matrix.shard }}
          path: TestResults/unit-junit.xml
          retention-days: 1

  merge-coverage:
    if: always() && (github.event.pull_request.draft == false || github.event_name == 'push')
    name: Merge coverage & SonarQube
    needs: test-shard
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fail if any shard failed
        if: needs.test-shard.result == 'failure'
        run: |
          echo "One or more test shards failed"
          exit 1

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Download all JUnit artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: junit-shard-*
          path: junit-shards

      - name: Merge LCOV reports
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          lcov_args=""
          for f in coverage-shards/coverage-shard-*/lcov.info; do
            lcov_args="$lcov_args --add-tracefile $f"
          done
          mkdir -p coverage
          lcov $lcov_args --output-file coverage/lcov.info

      - name: Set up Node.js
        uses: actions/setup-node@v6.5.0
        with:
          node-version-file: package.json

      - name: Merge JUnit reports
        run: |
          npx junit-merge --dir junit-shards --recursive --out TestResults/unit-junit.xml

      - name: SonarQube Scan (Pull Request)
        id: sonar-pr
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Check coverage on new code
        if: steps.sonar-pr.outcome == 'success' || steps.sonar-pr.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          status=$(curl -fsS -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=getlago_lago-front&pullRequest=${PR_NUMBER}")
          coverage=$(echo "$status" | jq -c '.projectStatus.conditions[] | select(.metricKey == "new_coverage")')

          if [ -z "$coverage" ]; then
            echo "Coverage on new code not evaluated (no or too few new lines)"
            exit 0
          fi

          actual=$(echo "$coverage" | jq -r '.actualValue')
          threshold=$(echo "$coverage" | jq -r '.errorThreshold')

          if [ "$(echo "$coverage" | jq -r '.status')" = "ERROR" ]; then
            echo "::error::Coverage on new code is ${actual}%, below the ${threshold}% threshold"
            exit 1
          fi

          echo "Coverage on new code is ${actual}% (threshold ${threshold}%)"

      - name: SonarQube Scan (Main Branch)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: .
          args: >
            -Dsonar.branch.name=main
